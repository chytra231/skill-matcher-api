<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insurance Premium Estimator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <p class="card__eyebrow">Insurance Premium Calculator</p>
    <h1 class="card__name">Life Cover Premium Estimator</h1>
    <p class="card__subtitle">Enter your plan details to see an estimated premium.</p>

    <form id="calculator-form" class="card__form" novalidate>
      <div class="field">
        <label for="plan-type">Plan Type</label>
        <select id="plan-type" name="plan-type" required>
          <option value="term">Term Plan</option>
          <option value="endowment">Endowment Plan</option>
          <option value="moneyback">Money Back Plan</option>
        </select>
      </div>

      <div class="field">
        <label for="age">Age</label>
        <input type="number" id="age" name="age" placeholder="e.g. 30" min="18" max="65" step="1" inputmode="numeric" required>
      </div>

      <div class="field">
        <label for="sum-assured">Sum Assured (₹)</label>
        <input type="number" id="sum-assured" name="sum-assured" placeholder="e.g. 1000000" min="0" step="1000" inputmode="decimal" required>
      </div>

      <div class="field">
        <label for="policy-term">Policy Term (years)</label>
        <input type="number" id="policy-term" name="policy-term" placeholder="e.g. 20" min="5" max="40" step="1" inputmode="numeric" required>
      </div>

      <button type="submit" class="card__toggle">Calculate Premium</button>
    </form>

    <div id="result" class="card__details" hidden>
      <dl>
        <div class="card__detail-row">
          <dt>Annual Premium</dt>
          <dd id="annual-premium">—</dd>
        </div>
        <div class="card__detail-row">
          <dt>Monthly Premium</dt>
          <dd id="monthly-premium" class="card__detail-value--secondary">—</dd>
        </div>
        <div id="maturity-row" class="card__detail-row" hidden>
          <dt>Maturity Value</dt>
          <dd id="maturity-value" class="card__detail-value--secondary">—</dd>
        </div>
        <div id="payout-row" class="card__detail-row" hidden>
          <dt>Periodic Payout</dt>
          <dd id="payout-value" class="card__detail-value--secondary">—</dd>
        </div>
      </dl>
    </div>

    <p class="card__disclaimer">Estimated, for practice purposes only — not official LIC rates or a real quote.</p>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
