<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary Hike Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <p class="card__eyebrow">Salary Hike Calculator</p>
    <h1 class="card__name">New Salary Estimator</h1>
    <p class="card__subtitle">Enter your current salary and hike percentage to see your new salary.</p>

    <form id="calculator-form" class="card__form" novalidate>
      <div class="field">
        <label for="current-salary">Current Salary</label>
        <input type="number" id="current-salary" name="current-salary" placeholder="e.g. 850000" min="0" step="0.01" inputmode="decimal" required>
      </div>

      <div class="field">
        <label for="hike-percentage">Hike Percentage</label>
        <input type="number" id="hike-percentage" name="hike-percentage" placeholder="e.g. 12" min="0" step="0.01" inputmode="decimal" required>
      </div>

      <button type="submit" class="card__toggle">Calculate</button>
    </form>

    <div id="result" class="card__details" hidden>
      <dl>
        <div class="card__detail-row">
          <dt>New Salary</dt>
          <dd id="result-value">—</dd>
        </div>
      </dl>
    </div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
