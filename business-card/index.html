<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chytra Krishnamurthy — Digital Business Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card" aria-live="polite">
    <p class="card__eyebrow">Digital Business Card</p>
    <h1 class="card__name">Chytra Krishnamurthy</h1>
    <p class="card__title">HR Leader &amp; AI Automation Specialist</p>

    <button id="contact-toggle" class="card__toggle" type="button" aria-expanded="false" aria-controls="contact-details">
      Show Contact Details
    </button>

    <div id="contact-details" class="card__details" hidden>
      <dl>
        <div class="card__detail-row">
          <dt>Email</dt>
          <dd><a href="mailto:chytra231@gmail.com">chytra231@gmail.com</a></dd>
        </div>
      </dl>
    </div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
